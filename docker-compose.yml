services:
  app:
    build: .
    env_file:
      - .env
    environment:
      APP_ENV: production
      PORT: "8080"
      WEB_CONCURRENCY: "2"
      DATABASE_PATH: /app/data/products.db
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/vps/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/vps/cloudflare-realip.conf:/etc/nginx/conf.d/cloudflare-realip.conf:ro
      - ./static:/var/www/static:ro
      - ./uploads:/var/www/uploads:ro
    restart: unless-stopped
