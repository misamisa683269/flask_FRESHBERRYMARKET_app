{% extends "base.html" %}

{% block title %}管理者ログイン | FRESHBERRYMARKET{% endblock %}

{% block content %}
<h1>管理者ログイン</h1>
<p class="muted">店舗管理用のログインです。一般のお客様は通常のログインをご利用ください。</p>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<form method="post">
  {% include "_csrf.html" %}
  <div class="form-field">
    <label>
      ユーザー名:
      <input type="text" name="username" required autocomplete="username" />
    </label>
  </div>
  <div class="form-field">
    <label>
      パスワード:
      <input type="password" name="password" required autocomplete="current-password" />
    </label>
  </div>
  <button type="submit">管理者としてログイン</button>
</form>
{% endblock %}
