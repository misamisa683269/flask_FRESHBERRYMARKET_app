{% extends "base.html" %}

{% block title %}ログイン | フレッシュベリー{% endblock %}

{% block content %}
<h1>ログイン</h1>
<p class="muted">会員のお客様向けログインです。</p>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<form method="post">
  {% include "_csrf.html" %}
  <div class="form-field">
    <label>
      ユーザー名:
      <input type="text" name="username" required autocomplete="username" />
    </label>
  </div>
  <div class="form-field">
    <label>
      パスワード:
      <input type="password" name="password" required autocomplete="current-password" />
    </label>
  </div>
  <button type="submit">ログイン</button>
</form>
<p class="muted" style="margin-top: 1rem">
  <a href="{{ url_for('forgot_password') }}">パスワードを忘れた場合</a>
</p>
<p class="muted"><a href="{{ url_for('register') }}">新規登録はこちら</a></p>
<p class="muted"><a href="{{ url_for('admin_login') }}">管理者の方はこちら</a></p>
{% endblock %}
