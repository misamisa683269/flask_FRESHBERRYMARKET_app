<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>ログイン | FRESHBERRYMARKET</title>
  </head>
  <body>
    <h1>ログイン</h1>
    {% include "_nav.html" %}
    {% if error %}
    <p>{{ error }}</p>
    {% endif %}
    <form method="post">
      <p>
        <label>
          ユーザー名:
          <input type="text" name="username" required />
        </label>
      </p>
      <p>
        <label>
          パスワード:
          <input type="password" name="password" required />
        </label>
      </p>
      <button type="submit">ログイン</button>
    </form>
    <p><a href="/register">新規登録はこちら</a></p>
  </body>
</html>
