{% extends "base.html" %}

{% block title %}ログイン | FRESHBERRYMARKET{% endblock %}

{% block content %}
<h1>ログイン</h1>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<form method="post">
  {% include "_csrf.html" %}
  <div class="form-field">
    <label>
      ユーザー名:
      <input type="text" name="username" required />
    </label>
  </div>
  <div class="form-field">
    <label>
      パスワード:
      <input type="password" name="password" required />
    </label>
  </div>
  <button type="submit">ログイン</button>
</form>
<p class="muted"><a href="{{ url_for('register') }}">新規登録はこちら</a></p>
{% endblock %}
