{% extends "base.html" %}

{% block title %}パスワードを忘れた場合 | FRESHBERRYMARKET{% endblock %}

{% block content %}
<h1>パスワードを忘れた場合</h1>
<p class="muted">
  登録したユーザー名またはメールアドレスを入力してください。
  開発中は再設定用URLがサーバーのターミナルに表示されます。
</p>
<form method="post">
  {% include "_csrf.html" %}
  <div class="form-field">
    <label>
      ユーザー名 または メールアドレス:
      <input type="text" name="identifier" required autocomplete="username" />
    </label>
  </div>
  <button type="submit">再設定案内を送る</button>
</form>
<p class="muted" style="margin-top: 1rem">
  <a href="{{ url_for('login') }}">ログインへ戻る</a>
</p>
{% endblock %}
