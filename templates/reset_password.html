{% extends "base.html" %}

{% block title %}パスワード再設定 | FRESHBERRYMARKET{% endblock %}

{% block content %}
<h1>パスワード再設定</h1>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<form method="post">
  {% include "_csrf.html" %}
  <div class="form-field">
    <label>
      新しいパスワード（8文字以上）:
      <input type="password" name="password" minlength="8" required autocomplete="new-password" />
    </label>
  </div>
  <div class="form-field">
    <label>
      新しいパスワード（確認）:
      <input type="password" name="password_confirm" minlength="8" required autocomplete="new-password" />
    </label>
  </div>
  <button type="submit">パスワードを再設定</button>
</form>
{% endblock %}
