<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>カート | FRESHBERRYMARKET</title>
  </head>
  <body>
    <h1>カート</h1>
    <p><a href="/products">商品一覧へ戻る</a></p>

    {% if items %}
    <ul>
      {% for item in items %}
      <li>
        {{ item.name }} — {{ item.price }}円 × {{ item.quantity }}
        = {{ item.subtotal }}円
      </li>
      {% endfor %}
    </ul>
    <p>合計: {{ total }}円</p>
    {% else %}
    <p>カートは空です。</p>
    {% endif %}
  </body>
</html>
