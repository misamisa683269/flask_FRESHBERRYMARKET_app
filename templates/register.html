{% extends "base.html" %}

{% block title %}新規登録 | FRESHBERRYMARKET{% endblock %}

{% block content %}
<h1>新規登録</h1>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<form method="post">
  <div class="form-field">
    <label>
      ユーザー名:
      <input type="text" name="username" required />
    </label>
  </div>
  <div class="form-field">
    <label>
      パスワード:
      <input type="password" name="password" required />
    </label>
  </div>
  <button type="submit">登録する</button>
</form>
<p class="muted"><a href="{{ url_for('login') }}">ログインはこちら</a></p>
{% endblock %}
