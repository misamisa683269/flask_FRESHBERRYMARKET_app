{% extends "base.html" %}

{% block title %}アカウント設定 | FRESHBERRYMARKET{% endblock %}

{% block content %}
<h1>アカウント設定</h1>
<p class="muted">自分のユーザー名を変更できます。</p>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<form method="post">
  {% include "_csrf.html" %}
  <div class="form-field">
    <label>
      ユーザー名:
      <input type="text" name="username" value="{{ username }}" required autocomplete="username" />
    </label>
  </div>
  <button type="submit">ユーザー名を変更</button>
</form>
{% endblock %}
