{% extends "base.html" %}

{% block title %}アカウント設定 | FRESHBERRYMARKET{% endblock %}

{% block content %}
<h1>アカウント設定</h1>
<p class="muted">
  ユーザー名とメールアドレスを変更できます。
  パスワード再設定にはメール登録が必要です。
</p>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<form method="post">
  {% include "_csrf.html" %}
  <div class="form-field">
    <label>
      ユーザー名:
      <input type="text" name="username" value="{{ username }}" required autocomplete="username" />
    </label>
  </div>
  <div class="form-field">
    <label>
      メールアドレス:
      <input type="email" name="email" value="{{ email }}" required autocomplete="email" />
    </label>
  </div>
  <button type="submit">保存する</button>
</form>
{% endblock %}
