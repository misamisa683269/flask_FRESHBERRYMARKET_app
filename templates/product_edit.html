{% extends "base.html" %}

{% block title %}商品を編集 | FRESHBERRYMARKET{% endblock %}

{% block content %}
<h1>商品を編集</h1>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
{% if product.image_filename %}
<p>
  <img
    class="product-image"
    src="{{ url_for('uploaded_file', filename=product.image_filename) }}"
    alt="{{ product.name }}"
  />
</p>
{% endif %}
<form method="post" enctype="multipart/form-data">
  <div class="form-field">
    <label>
      商品名:
      <input type="text" name="name" value="{{ product.name }}" required />
    </label>
  </div>
  <div class="form-field">
    <label>
      価格（円）:
      <input type="number" name="price" value="{{ product.price }}" min="0" required />
    </label>
  </div>
  <div class="form-field">
    <label>
      説明:
      <input type="text" name="description" value="{{ product.description }}" required />
    </label>
  </div>
  <div class="form-field">
    <label>
      在庫:
      <input type="number" name="stock" value="{{ product.stock }}" min="0" required />
    </label>
  </div>
  <div class="form-field">
    <label>
      画像（変更する場合のみ選択）:
      <input type="file" name="image" accept=".png,.jpg,.jpeg,.gif,.webp,image/*" />
    </label>
  </div>
  <button type="submit">更新する</button>
  <a class="button button-light" href="{{ url_for('product_detail', product_id=product.id) }}">
    キャンセル
  </a>
</form>
{% endblock %}
