<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>注文完了 | FRESHBERRYMARKET</title>
  </head>
  <body>
    <h1>注文完了</h1>
    <p>ご注文ありがとうございました。</p>

    <ul>
      {% for item in items %}
      <li>
        {{ item.name }} — {{ item.price }}円 × {{ item.quantity }}
        = {{ item.subtotal }}円
      </li>
      {% endfor %}
    </ul>
    <p>合計: {{ total }}円</p>

    <p><a href="/products">商品一覧へ戻る</a></p>
  </body>
</html>
