# FRESHBERRYMARKET — nginx (Ubuntu VPS)
# 配置先例: /etc/nginx/sites-available/freshberrymarket
# 有効化: sudo ln -s /etc/nginx/sites-available/freshberrymarket /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name freshberrymarket.com www.freshberrymarket.com;

    client_max_body_size 16M;

    location /static/ {
        alias /var/www/freshberrymarket/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /uploads/ {
        alias /var/www/freshberrymarket/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
