# Docker Compose 用 nginx（app サービスへプロキシ）
# cloudflare-realip.conf は conf.d に別ファイルで読み込まれる

map $http_x_forwarded_proto $eff_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    listen [::]:80;
    server_name freshberrymarket.com www.freshberrymarket.com _;

    client_max_body_size 16M;

    location /static/ {
        alias /var/www/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /uploads/ {
        alias /var/www/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /health {
        proxy_pass http://app:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $eff_proto;
        proxy_read_timeout 120s;
    }
}
